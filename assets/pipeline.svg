<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430"
     font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img"
     aria-label="Data pipeline: Mendeley Baltic indices and Yahoo market data feed build_panel.py, which feeds train_model.py and metrics.json; IMF PortWatch feeds congestion.py; ports.py computes part-load capacity from physics; all three reach the Flask dashboard. A MILP selection stage is not yet built.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8279"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/>
    </marker>
  </defs>

  <rect width="940" height="430" fill="#f6f3ee"/>

  <!-- column headings -->
  <g font-size="11" font-weight="700" letter-spacing="1.6" fill="#8a8279">
    <text x="28"  y="34">SOURCES</text>
    <text x="268" y="34">FEATURES &amp; PHYSICS</text>
    <text x="546" y="34">MODEL</text>
    <text x="782" y="34">SERVE</text>
  </g>
  <g stroke="#e2ddd3" stroke-width="1">
    <line x1="28" y1="44" x2="912" y2="44"/>
  </g>

  <!-- ── sources ── -->
  <g fill="#fffefb" stroke="#c9c2b6" stroke-width="1">
    <rect x="28" y="64"  width="186" height="52" rx="3"/>
    <rect x="28" y="130" width="186" height="52" rx="3"/>
    <rect x="28" y="240" width="186" height="52" rx="3"/>
    <rect x="28" y="306" width="186" height="52" rx="3"/>
  </g>
  <g font-size="13" font-weight="600" fill="#1a1614">
    <text x="44" y="86">Mendeley · Baltic</text>
    <text x="44" y="152">Yahoo Finance</text>
    <text x="44" y="262">IMF PortWatch</text>
    <text x="44" y="328">Open-Meteo</text>
  </g>
  <g font-size="11" fill="#8a8279">
    <text x="44" y="104">1,749 rows · to 2019</text>
    <text x="44" y="170">macro + BDRY</text>
    <text x="44" y="280">11 ports · to last week</text>
    <text x="44" y="346">wind, gusts, rain</text>
  </g>

  <!-- ── features &amp; physics ── -->
  <g fill="#fffefb" stroke="#c9c2b6" stroke-width="1">
    <rect x="268" y="76"  width="196" height="58" rx="3"/>
    <rect x="268" y="170" width="196" height="58" rx="3"/>
    <rect x="268" y="264" width="196" height="58" rx="3"/>
  </g>
  <g font-size="13" font-weight="600" fill="#1a1614">
    <text x="284" y="99">build_panel.py</text>
    <text x="284" y="193">ports.py</text>
    <text x="284" y="287">congestion.py</text>
  </g>
  <g font-size="11" fill="#8a8279">
    <text x="284" y="117">1,682 rows · 17 features</text>
    <text x="284" y="211">TPC part-load capacity</text>
    <text x="284" y="305">activity vs own history</text>
  </g>
  <text x="284" y="228" font-size="10.5" fill="#c2410c" font-style="italic">physics, not fitted</text>

  <!-- ── model ── -->
  <g fill="#fffefb" stroke="#c9c2b6" stroke-width="1">
    <rect x="518" y="76"  width="186" height="58" rx="3"/>
    <rect x="518" y="152" width="186" height="46" rx="3"/>
  </g>
  <text x="534" y="99"  font-size="13" font-weight="600" fill="#1a1614">train_model.py</text>
  <text x="534" y="117" font-size="11" fill="#8a8279">walk-forward · 8 folds</text>
  <text x="534" y="172" font-size="12" font-weight="600" fill="#1a1614">metrics.json</text>
  <text x="534" y="188" font-size="11" fill="#8a8279">oos_predictions.parquet</text>

  <!-- MILP, not yet built -->
  <rect x="518" y="264" width="186" height="58" rx="3" fill="#fdf4ec"
        stroke="#c2410c" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="534" y="287" font-size="13" font-weight="600" fill="#7c2d12">MILP selection</text>
  <text x="534" y="305" font-size="11" fill="#a8592c">vessel × port × tonnage</text>
  <text x="640" y="341" font-size="10.5" font-weight="700" fill="#c2410c"
        letter-spacing="1.2" text-anchor="middle">NOT YET BUILT</text>

  <!-- ── serve ── -->
  <rect x="758" y="152" width="154" height="76" rx="3" fill="#fffefb"
        stroke="#c2410c" stroke-width="1.6"/>
  <text x="774" y="180" font-size="13" font-weight="600" fill="#1a1614">app.py</text>
  <text x="774" y="198" font-size="11" fill="#8a8279">Flask API</text>
  <text x="774" y="215" font-size="11" fill="#8a8279">4-view dashboard</text>

  <!-- ── arrows ── -->
  <g stroke="#8a8279" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <!-- Mendeley + Yahoo -> build_panel -->
    <path d="M214 90 H240 V105 H262"/>
    <path d="M214 156 H240 V105 H262"/>
    <!-- PortWatch -> congestion -->
    <path d="M214 266 H240 V293 H262"/>
    <!-- build_panel -> train_model -->
    <path d="M464 105 H512"/>
    <!-- train_model -> metrics -->
    <path d="M611 134 V146"/>
    <!-- metrics -> app -->
    <path d="M704 175 H752"/>
    <!-- ports -> app -->
    <path d="M464 199 H490 V190 H752"/>
    <!-- congestion -> app -->
    <path d="M366 322 V352 H744 V234 H752" stroke-linejoin="round"/>
  </g>

  <!-- Open-Meteo is used only by the falsification test, not the model -->
  <path d="M214 332 H240 V300 H262" stroke="#8a8279" stroke-width="1.2" fill="none"
        stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="228" y="372" font-size="10.5" fill="#8a8279" font-style="italic">falsification test only</text>

  <!-- dashed feeds into the unbuilt MILP -->
  <g stroke="#c2410c" stroke-width="1.2" fill="none" stroke-dasharray="5 4" marker-end="url(#ad)">
    <path d="M464 213 H486 V278 H512"/>
    <path d="M464 307 H512"/>
  </g>
  <path d="M704 293 H730 V240 H752" stroke="#c2410c" stroke-width="1.2" fill="none"
        stroke-dasharray="5 4" marker-end="url(#ad)"/>

  <!-- footnote -->
  <line x1="28" y1="392" x2="912" y2="392" stroke="#e2ddd3" stroke-width="1"/>
  <text x="28" y="412" font-size="11" fill="#8a8279">
    Two independent chains reach the dashboard: PortWatch begins 2019-01-01 and the Baltic series ends 2019-07-31, an overlap of 211 days —
  </text>
  <text x="28" y="426" font-size="11" fill="#8a8279">
    far too little to learn congestion effects on rates. The rate model is statistical; the port model is deterministic.
  </text>
</svg>
